name: Rebuild SEO and deploy static website

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - 'scripts/**'
      - 'index.html'
      - 'privacy.html'
      - 'terms.html'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate every product and category page, SEO metadata and sitemap
        run: python scripts/build_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
